<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shared Checklist</title>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            color-scheme: dark;
            --ash: #d6d0b8;
            --paper: #c8c1a5;
            --paper-dark: #a8a184;
            --ink: #24271d;
            --olive: #596044;
            --olive-light: #737957;
            --rust: #8f3d2f;
            --rust-dark: #642b24;
        }

        body {
            margin: 0;
            min-height: 100vh;
            color: var(--ash);
            font-family: "Courier New", Courier, monospace;
            background-color: #20231d;
            background-image:
                radial-gradient(ellipse at 18% 8%, rgba(117, 112, 77, 0.16), transparent 42%),
                radial-gradient(ellipse at 88% 72%, rgba(115, 53, 38, 0.12), transparent 38%),
                repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.08) 0, rgba(0, 0, 0, 0.08) 1px, transparent 1px, transparent 4px);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 50px 20px;
        }

        .container {
            width: 100%;
            max-width: 760px;
            padding: 30px;
            position: relative;
            background: #34372b;
            border: 1px solid #65664c;
            box-shadow: 0 18px 45px rgba(0, 0, 0, 0.45), inset 0 0 0 5px rgba(0, 0, 0, 0.12);
        }

        .container::before,
        .container::after {
            content: "";
            position: absolute;
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #151711;
            border: 1px solid #77745a;
            box-shadow: inset 0 1px 2px #000;
        }

        .container::before {
            top: 10px;
            left: 10px;
        }

        .container::after {
            top: 10px;
            right: 10px;
        }

        h1 {
            margin: 0 0 10px;
            color: #ded7b9;
            font-family: Impact, "Arial Narrow", sans-serif;
            font-size: clamp(32px, 6vw, 44px);
            font-weight: 900;
            letter-spacing: 2px;
            line-height: 1.05;
            text-transform: uppercase;
            text-shadow: 2px 2px 0 #171912, 3px 3px 0 #77704f;
        }

        .subtitle {
            color: #aaa78a;
            margin-bottom: 28px;
            padding-bottom: 17px;
            border-bottom: 2px dashed #66674d;
            font-size: 13px;
            line-height: 1.6;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .progress {
            height: 16px;
            background: #191c16;
            border: 1px solid #77765a;
            border-radius: 0;
            overflow: hidden;
            margin-bottom: 25px;
            padding: 3px;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.65);
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: repeating-linear-gradient(135deg, #8b8b5e 0, #8b8b5e 7px, #6f744a 7px, #6f744a 14px);
            transition: width 0.25s ease;
        }

        .checklist {
            display: flex;
            flex-direction: column;
            gap: 11px;
        }

        .item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 16px 18px;
            color: var(--ink);
            background-color: var(--paper);
            background-image:
                repeating-linear-gradient(0deg, rgba(75, 65, 42, 0.035) 0, rgba(75, 65, 42, 0.035) 1px, transparent 1px, transparent 4px);
            border: 1px solid #8b866a;
            border-left: 5px solid var(--olive);
            border-radius: 1px;
            box-shadow: 2px 3px 0 rgba(0, 0, 0, 0.22);
            cursor: pointer;
            transition: background-color 0.15s, border-color 0.15s, transform 0.15s;
        }

        .item:nth-child(odd) {
            transform: rotate(-0.15deg);
        }

        .item:nth-child(even) {
            border-left-color: var(--rust);
            transform: rotate(0.12deg);
        }

        .item:hover {
            background-color: #ded7bc;
            border-color: #b0a98a;
            transform: translateX(3px);
        }

        .checkbox {
            width: 24px;
            height: 24px;
            border: 2px solid #77735c;
            border-radius: 0;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(50, 48, 34, 0.06);
            transition: 0.15s;
        }

        .item.checked .checkbox {
            background: var(--rust);
            border-color: var(--rust-dark);
        }

        .checkbox::after {
            content: "X";
            color: #f0e5c8;
            font-family: "Courier New", Courier, monospace;
            font-size: 17px;
            font-weight: 900;
            opacity: 0;
            transform: rotate(-8deg);
        }

        .item.checked .checkbox::after {
            opacity: 1;
        }

        .text {
            font-size: 15px;
            font-weight: 700;
            line-height: 1.5;
        }

        .item.checked .text {
            color: #77735f;
            text-decoration: line-through;
            text-decoration-color: #8f3d2f;
            text-decoration-thickness: 2px;
        }

        .status {
            margin-top: 22px;
            padding-top: 14px;
            color: #aaa78a;
            border-top: 2px dashed #66674d;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .error {
            color: #e18a72;
        }

        @media (max-width: 520px) {
            body {
                padding: 18px 10px;
            }

            .container {
                padding: 24px 14px 18px;
            }

            .item {
                gap: 12px;
                padding: 13px 12px;
            }

            .text {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>My Checklist</h1>

    <div class="subtitle">
        Shared checklist — changes are visible to everyone.
    </div>

    <div class="progress">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="checklist" id="checklist"></div>

    <div class="status" id="status">
        Connecting...
    </div>

</div>


<script type="module">

    const SUPABASE_URL = "https://jjdpdgrrnttponznkzah.supabase.co";

    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpqZHBkZ3JybnR0cG9uem5remFoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2MjIyMjQsImV4cCI6MjEwNjE5ODIyNH0.pA_OwfUW3xPC9RU6Fr2P024HckH5QdnF1yEe1aqb0JQ";

    const ITEMS = [
        {
            id: "item-1",
            text: "Fashion Show: Theme a collection of outfits, take a group photo."
        },

        {
            id: "item-2",
            text: "Thanksgiving: Cook a full dinner, and eat it together around a table."
        },

        {
            id: "item-3",
            text: "Salad Fingers: Fill an entire backpack with spoons."
        },

        {
            id: "item-4",
            text: "Louisville Sluggter: Clear an entire city block with only baseball bats."
        },

        {
            id: "item-5",
            text: "Speedrunner: Cross the entire mall in under two minutes."
        },

        {
            id: "item-6",
            text: "Payday: Perform a heist on Sky Blue Banking."
        },

        {
            id: "item-7",
            text: "Grand Theft Auto: Steal ten cars."
        },

        {
            id: "item-8",
            text: "The Long Walk: Everyone must cross one end of the city to the other, exclusively on foot."
        },

        {
            id: "item-9",
            text: "Parade: Kite a hoard of zombies around a full city block."
        },

        {
            id: "item-10",
            text: "Public School: Attend a class at Evergreen Public School."
        },

        {
            id: "item-11",
            text: "Track and Field: Run a race around the university track."
        },

        {
            id: "item-12",
            text: "Go bowling."
        },

        {
            id: "item-13",
            text: "Get licensed: Visit ABCDriving School and have a test administered by rainbowlarva."
        },

        {
            id: "item-16",
            text: "Hide and Seek: Play a game of hide and seek."
        },

        {
            id: "item-17",
            text: "Gone Fishing: Catch a fish and cook it."
        },

        {
            id: "item-18",
            text: "Go to a bar and wait for this whole thing to blow over."
        },


    ];

    import {
        createClient
    } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


    const supabase = createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


    const checklistElement =
        document.getElementById("checklist");

    const progressBar =
        document.getElementById("progressBar");

    const statusElement =
        document.getElementById("status");


    let state = {};


    function render() {

        checklistElement.innerHTML = "";

        let completed = 0;

        ITEMS.forEach(item => {

            const checked = state[item.id] === true;

            if (checked) {
                completed++;
            }

            const element =
                document.createElement("div");

            element.className =
                "item" + (checked ? " checked" : "");

            element.innerHTML = `
                <div class="checkbox"></div>
                <div class="text">
                    ${escapeHTML(item.text)}
                </div>
            `;

            element.addEventListener(
                "click",
                () => toggleItem(item.id, !checked)
            );

            checklistElement.appendChild(element);
        });


        const percentage =
            ITEMS.length === 0
                ? 0
                : (completed / ITEMS.length) * 100;


        progressBar.style.width =
            percentage + "%";


        statusElement.textContent =
            `${completed} / ${ITEMS.length} completed`;
    }


    function escapeHTML(text) {

        const div =
            document.createElement("div");

        div.textContent = text;

        return div.innerHTML;
    }


    async function loadChecklist() {

        const { data, error } =
            await supabase
                .from("checklist")
                .select("id, checked");


        if (error) {

            console.error(error);

            statusElement.textContent =
                "Could not connect to checklist.";

            statusElement.classList.add("error");

            return;
        }


        state = {};

        data.forEach(row => {
            state[row.id] = row.checked;
        });


        render();
    }



    async function toggleItem(id, checked) {

    state[id] = checked;
    render();

    const channel =
        new BroadcastChannel("shared-checklist");

    channel.postMessage({
        id: id,
        checked: checked
    });

    channel.close();


    const { error } =
        await supabase
            .from("checklist")
            .update({
                checked: checked
            })
            .eq("id", id);


    if (error) {

        console.error(error);

        statusElement.textContent =
            "Failed to save change.";

        statusElement.classList.add("error");

        loadChecklist();

        return;
    }

    statusElement.classList.remove("error");
}

    supabase
        .channel("checklist-changes")

        .on(
            "postgres_changes",
            {
                event: "*",
                schema: "public",
                table: "checklist"
            },

            payload => {

                const row =
                    payload.new;

                if (!row || !row.id) {
                    return;
                }

                state[row.id] =
                    row.checked;

                render();
            }
        )

        .subscribe();


    loadChecklist();

    const browserChannel =
    new BroadcastChannel("shared-checklist");

browserChannel.onmessage = (event) => {

    const { id, checked } = event.data;

    if (!id) {
        return;
    }

    state[id] = checked;

    render();
};

</script>

</body>
</html>
